services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../:/app

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infinance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A src.infrastructure.celery.config.celery_app worker --loglevel=info
    env_file:
      - ../.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../:/app

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A src.infrastructure.celery.config.celery_app beat --loglevel=info
    env_file:
      - ../.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../:/app

volumes:
  postgres_data:
